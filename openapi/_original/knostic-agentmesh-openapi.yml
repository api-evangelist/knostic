  /scans:
    get:
      operationId: listScans
      summary: List scans
      description: Returns your adhoc scan history, ordered by most recent first. Shows status, result,
        and timestamps for each scan. Response includes X-Scan-Limit-Remaining header with remaining daily
        scan credits.
      tags:
      - scans
      responses:
        '200':
          description: Paginated array of scan records.
          content:
            application/json:
              schema:
                type: object
                properties:
                  scans:
                    type: array
                    description: Array of scan objects
                    items:
                      $ref: '#/components/schemas/Scan'
                  total:
                    type: integer
                    description: Total scans for this API key
                  page:
                    type: integer
                    description: Current page
                  limit:
                    type: integer
                    description: Page size
              examples:
                default:
                  summary: Provider-published example
                  value:
                    scans:
                    - scan_id: 1
                      scan_type: skill
                      target:
                        git_repo: anthropics/skills
                        skill_path: SKILL.md
                        commit_hash: a1b2c3d
                      status: completed
                      result: pass
                      error: null
                      created_at: '2026-03-05T10:00:00+00:00'
                      started_at: '2026-03-05T10:00:01+00:00'
                      completed_at: '2026-03-05T10:00:12+00:00'
                    total: 1
                    page: 1
                    limit: 20
