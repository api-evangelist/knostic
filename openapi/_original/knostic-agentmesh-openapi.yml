      - bearerAuth: []
      x-requires-api-key: true
  /scans/{scan_id}:
    get:
      operationId: getScan
      summary: Get scan result
      description: Poll for the result of an adhoc scan. When pending, returns queue position and time
        estimate. When completed, returns the scan result and details. You can only access scans created
        with your own API key.
      tags:
      - scans
      responses:
        '200':
          description: Scan status with result details when completed.
          content:
            application/json:
              schema:
                type: object
                properties:
                  scan_id:
                    type: integer
                    description: Scan ID
                  scan_type:
                    type: string
                    description: skill or extension
                  target:
                    type: object
                    description: What was scanned (repo, path, etc.)
                  status:
                    type: string
                    description: pending, running, completed, or failed
                  result:
                    type:
                    - string
                    - 'null'
                    description: Scan result (pass/warn/fail for skills, safe/low/medium/high/critical
                      for extensions)
                  details:
                    type:
                    - object
                    - 'null'
                    description: Full scan output (matches, files scanned, etc.)
                  error:
                    type:
                    - string
                    - 'null'
                    description: Error message if scan failed
              examples:
                default:
                  summary: Provider-published example
                  value:
                    scan_id: 1
                    scan_type: skill
                    target:
                      git_repo: anthropics/skills
                      skill_path: SKILL.md
                      commit_hash: a1b2c3d
                    status: completed
                    result: pass
                    details:
                      matches: []
                      files_scanned: 3
                    completed_at: '2026-03-05T10:00:12+00:00'
        '401':
          description: Missing or invalid API key
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                default:
                  value:
                    detail: missing or invalid api key
        '403':
          description: Scan belongs to a different API key
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                default:
                  value:
                    detail: scan belongs to a different api key
        '404':
          description: Scan not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                default:
                  value:
                    detail: scan not found
      parameters:
      - name: scan_id
        in: path
        required: true
        description: Scan ID returned from POST /scan/*
        schema:
          type: integer
      security:
      - bearerAuth: []
      x-requires-api-key: true
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      description: 'AgentMesh API key issued from the console (POST /api/console/keys), sent as `Authorization:
        Bearer <api_key>`. Read endpoints also serve anonymous callers at a reduced tier.'
  schemas:
    Error:
      type: object
      description: AgentMesh error envelope.
      properties:
        detail:
          type: string
          description: Human-readable error message
    ScanResult:
      type: object
      properties:
        scannerName:
          type: string
          description: Scanner identifier (e.g. 'nova')
        scannerVersion:
          type: string
          description: Version of the scanner that produced this result
        result:
          type: string
          description: Scan verdict (pass, warn, fail, error)
        details:
          type:
          - object
          - 'null'
          description: Scanner-specific output
        scannedAt:
          type:
          - string
          - 'null'
          description: ISO-8601 timestamp when the scan ran
    Version:
      type: object
      properties:
        id:
          type: integer
          description: Version ID
        commitHash:
          type: string
          description: Git commit SHA at this version
        commitTimestamp:
          type:
          - string
          - 'null'
          description: ISO-8601 timestamp of the commit
        scanSummary:
          type: string
          description: Aggregate scan status for this version
        fileSha256:
          type:
          - string
          - 'null'
          description: SHA-256 of the archived artifact at this version
    SkillSummary:
      type: object
      properties:
        id:
          type: integer
          description: Skill ID
        name:
          type: string
          description: Skill name
        gitRepo:
          type: string
          description: GitHub repository URL
        skillPath:
          type: string
          description: Path to SKILL.md in the repo
        description:
          type: string
          description: Skill description
        sourceUrl:
          type: string
          description: URL of the aggregator/source page where this skill was discovered
        stars:
          type: integer
          description: GitHub stars
        license:
          type: string
          description: SPDX license identifier
        archived:
          type: boolean
          description: Whether the upstream GitHub repo is archived
        latestVersionAt:
          type: string
        scanStatus:
          type: string
          description: Aggregate scan status for the selected version
        latestScanAt:
          type: string
        contributor:
          type: string
          description: GitHub login of the most recent committer, or null if unknown
        fileSha256:
          type: string
          description: SHA-256 hash (lowercase hex) of the archived extension artifact. null until the
            upstream pipeline computes it.
    McpServerSummary:
      type: object
      properties:
        id:
          type: integer
          description: Skill ID
        name:
          type: string
          description: Skill name
        gitRepo:
          type: string
          description: GitHub repository URL
        serverPath:
          type: string
          description: Path to the server within the repo
        description:
          type: string
          description: Skill description
        sourceUrl:
          type: string
          description: URL of the aggregator/source page where this skill was discovered
        stars:
          type: integer
          description: GitHub stars
        license:
          type: string
          description: SPDX license identifier
        archived:
          type: boolean
          description: Whether the upstream GitHub repo is archived
        latestVersionAt:
          type: string
        scanStatus:
          type: string
          description: Aggregate scan status for the selected version
        latestScanAt:
          type: string
        fileSha256:
          type: string
          description: SHA-256 hash (lowercase hex) of the archived extension artifact. null until the
            upstream pipeline computes it.
    ExtensionSummary:
      type: object
      properties:
        id:
          type: integer
          description: Skill ID
        extensionId:
          type: string
          description: Marketplace extension identifier
        publisher:
          type: string
          description: Publisher name
        name:
          type: string
          description: Skill name
        displayName:
          type: string
          description: Display name
        version:
          type: string
          description: Current version
        installCount:
          type: integer
          description: Total installs
        rating:
          type: number
          description: Average marketplace rating
        marketplace:
          type: string
          description: Marketplace identifier (e.g. 'vscode', 'open-vsx')
        description:
          type: string
          description: Skill description
        lastUpdated:
          type: string
          description: ISO-8601 timestamp of the last marketplace update
        riskStatus:
          type: string
          description: Normalized risk status (pass/warn/fail/gray)
        riskLevel:
          type: string
          description: Raw risk level (safe/low/medium/high/critical)
        riskReasons:
          type:
          - string
          - 'null'
          description: List of risk reason strings
        verified:
          type: boolean
          description: Whether the publisher is marketplace-verified
        downloadUrl:
          type: string
          description: Marketplace download URL
        latestScanTimestamp:
          type: string
        fileSha256:
          type: string
          description: SHA-256 hash (lowercase hex) of the archived extension artifact. null until the
