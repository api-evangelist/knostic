        required: false
        description: 'Filter by SHA-256 hash (64 hex characters) of the archived extension VSIX bytes.
          Returns extensions whose fileSha256 matches. Note: extensions don''t currently have a multi-version
          dedup wrapper, so this matches any row whose hash equals the input. Composes with q, status,
          and marketplace.'
        schema:
          type: string
      - name: page
        in: query
        required: false
        description: Page number
        schema:
          type: integer
          default: 1
      - name: limit
        in: query
        required: false
        description: Results per page (1–200)
        schema:
          type: integer
          default: 50
  /extensions/{ext_id}:
