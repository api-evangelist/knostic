  /scan/skill/{slug}:
    post:
      operationId: scanSkill
      summary: Scan skill
      description: Trigger an on-demand security scan for a skill. The slug format is owner:repo for root-level
        skills or owner:repo:skill_name for nested skills. Returns immediately with a scan ID — poll GET
        /scans/:scan_id for results. Rate limited to 30 scans/day per API key.
      tags:
      - scans
      responses:
        '200':
          description: Scan job accepted with queue position and time estimate.
          content:
            application/json:
              schema:
                type: object
                properties:
                  scan_id:
                    type: integer
                    description: Unique scan ID for polling
                  status:
                    type: string
                    description: Initial status (pending)
                  position_in_queue:
                    type: integer
                    description: Position in the scan queue
                  estimated_seconds:
                    type: integer
                    description: Estimated time until completion
              examples:
                default:
                  summary: Provider-published example
                  value:
                    scan_id: 1
                    status: pending
                    position_in_queue: 1
                    estimated_seconds: 30
        '401':
          description: Missing or invalid API key
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                default:
                  value:
                    detail: missing or invalid api key
        '404':
          description: Skill not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                default:
                  value:
                    detail: skill not found
        '429':
          description: Daily scan limit exceeded (30/day)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                default:
                  value:
                    detail: daily scan limit exceeded (30/day)
        '503':
          description: Scan queue is full, try again later
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                default:
                  value:
                    detail: scan queue is full, try again later
      parameters:
      - name: slug
        in: path
        required: true
        description: Skill slug — e.g. anthropics:skills or anthropics:skills:algorithmic-art
        schema:
          type: string
      security:
      - bearerAuth: []
      x-requires-api-key: true
