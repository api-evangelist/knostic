summary: >-
  Knostic publishes no test/live key separation, no sandbox environment, and no magic test
  values. What it does provide is an in-browser API playground on the reference page and an
  anonymous read tier that lets a developer exercise the real catalog endpoints against
  production data with no credential at all — the practical equivalent of a try-it console,
  against live data.
