aid: knostic
name: Knostic
description: >-
  Knostic secures the AI agent supply chain inside the enterprise. Its platform discovers
  shadow AI, coding assistants, MCP servers and IDE extensions in use across an
  organization, then scans them for prompt injection, data exfiltration, secret and PII
  leakage, and destructive commands. Knostic runs AgentMesh, a public reputation and
  threat-intelligence service that continuously discovers, tracks and scans AI agent
  skills, Model Context Protocol servers, and VS Code / IDE marketplace extensions —
  roughly 80,500 skills, 4,800 MCP servers and 59,900 extensions as of July 2026 — and
  exposes that catalog with per-version scan verdicts through a REST API whose read
  endpoints answer anonymous callers. Knostic also ships a substantial open-source
  portfolio: AgentSonar (shadow-AI network detection), OpenAnt (LLM-based vulnerability
  discovery), MCP-Scanner, and security and telemetry plugins for OpenClaw agents.
